name: LifeOS
options:
  bundleIdPrefix: com.lifeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # preencha com seu Team (Apple ID gratuito serve)
    CODE_SIGN_STYLE: Automatic
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    info:
      path: LifeOS/Info.plist
      properties:
        CFBundleDisplayName: LifeOS
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "O LifeOS usa o Face ID para proteger seus dados pessoais, financeiros e documentos."
        NSCameraUsageDescription: "A câmera é usada apenas quando você decide fotografar compras ou documentos. As fotos são processadas no próprio iPhone."
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSTests
    dependencies:
      - target: LifeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app.tests
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
        LifeOSTests: [test]
    test:
      targets: [LifeOSTests]
